confirm_os_window_close 0
font_size 10
font_family JetBrainsMono Nerd Font Mono

background_opacity                  0.7

text_composition_strategy            1.0 30

cursor_shape               block
cursor_trail                1

window_padding_width        0

include current-theme.conf

bell                 none
shell /usr/bin/zsh

allow_remote_control  yes
