# AMOLED: black surfaces, one light accent. Fixed, no pywal.
#
# The three arrays below are qt6ct's [ColorScheme], serialised in
# QPalette::ColorRole order -- NOT the order the colours read as "makes sense":
#
#   Window WindowText Base AlternateBase ToolTipBase ToolTipText Text Button
#   ButtonText BrightText Highlight HighlightedText Link LinkVisited Light
#   Midlight Dark Shadow PlaceholderText Accent AccentText
#
# They were previously written in the wrong order, which put the light text
# colour #d7d6df into slot 0 (Window), slot 2 (Base) and slot 7 (Button). Qt
# read that as a *light* scheme, so every Qt app -- Krita included -- came out
# near-white regardless of what this file said. The hex values themselves were
# always right; only the slots they were filed in were wrong.
[General]

[ColorScheme]
active_colors=#ff000000, #ffd7d6df, #ff000000, #ff0a0a0a, #ff2a2a2a, #ffd7d6df, #ffd7d6df, #ff2a2a2a, #ffd7d6df, #ffd7d6df, #ff61afef, #ff000000, #ff61afef, #ffc678dd, #ff2a2a2a, #ff2a2a2a, #ff000000, #ff000000, #ff6c7086, #ff61afef, #ff000000
disabled_colors=#ff000000, #ff6c7086, #ff000000, #ff0a0a0a, #ff2a2a2a, #ff6c7086, #ff6c7086, #ff2a2a2a, #ff6c7086, #ff6c7086, #ff333333, #ff000000, #ff6c7086, #ff6c7086, #ff2a2a2a, #ff2a2a2a, #ff000000, #ff000000, #ff6c7086, #ff333333, #ff000000
inactive_colors=#ff000000, #ff9a9a94, #ff000000, #ff0a0a0a, #ff2a2a2a, #ff9a9a94, #ff9a9a94, #ff2a2a2a, #ff9a9a94, #ff9a9a94, #ff333333, #ff000000, #ff6c7086, #ffc678dd, #ff2a2a2a, #ff2a2a2a, #ff000000, #ff000000, #ff6c7086, #ff333333, #ff000000

[Fonts]
font=Iosevka Nerd Font,10,-1,5,50,0,0,0,0,0
