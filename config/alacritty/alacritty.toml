# Alacritty 0.17. Font size 10.

[general]
live_config_reload = true

[font]
size = 10.0
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
offset = { x = 0, y = 0 }

[colors]
# 6-digit hex only, no alpha, so the pane is always filled. opacity is the only
# lever; self_sample in hyprland.lua keeps the text readable over the glass.
primary = { background = "#000000", foreground = "#d7d6df" }
cursor = { text = "#000000", cursor = "#d7d6df" }
selection = { text = "#d7d6df", background = "#2a2a2a" }

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
decorations = "Full"
opacity = 0.72
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3